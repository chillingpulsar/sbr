name: Deploy to Cloudflare Pages

# Runs on every push to `main` (including merges from PRs into `main`).
on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message || github.sha }}
        run: |
          bunx wrangler pages project create sbr-mike --production-branch=main || true
          bunx wrangler pages deploy .svelte-kit/cloudflare \
            --project-name=sbr-mike \
            --branch=main \
            --commit-hash="$COMMIT_SHA" \
            --commit-message="$COMMIT_MSG" \
            --commit-dirty=false
